name: Build WSL2 Dev Release Kernel

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'latest = only newest upstream tag; all_major = one build per kernel major (X.Y), e.g. 5.10/5.15/6.1/6.6/6.18'
        required: false
        default: 'latest'
  repository_dispatch:
    types: [build-latest, build-all-major]
  schedule:
   - cron: "0 */4 * * *" # min hour day week year

concurrency: builder-${{ github.event_name }}-${{ github.sha }}

env:
  BUILD_THREAD: 3

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # For latest mode: single tag. For all_major mode: json array [{tag, major}, ...]
      build_targets: ${{ steps.gettags.outputs.build_targets }}
      build_mode: ${{ steps.gettags.outputs.build_mode }}
    steps:
      - name: Sync microsoft/WSL2-Linux-Kernel Release Tags
        id: gettags
        run: |
          # Fetch ALL releases, then group by major (X.Y), keeping the newest of each.
          # 'latest' mode keeps only the single newest release overall.
          MODE="${{ github.event.client_payload.build_mode || github.event.inputs.build_mode || 'latest' }}"

          gh release list -R microsoft/WSL2-Linux-Kernel --limit 300 --json tagName,publishedAt \
            | jq -r '.[].tagName' > all_tags

          # Group by major, newest per major (tags sort naturally: linux-msft-wsl-X.Y.Z.N)
          TARGETS=$(python3 - <<'EOF'
          import json, re, os
          tags = [l.strip() for l in open('all_tags') if l.strip()]
          parsed = []
          for t in tags:
              m = re.match(r'linux-msft-wsl-(\d+)\.(\d+)\.(\d+)\.(\d+)$', t)
              if m:
                  parsed.append((tuple(int(x) for x in m.groups()), t))
          parsed.sort(reverse=True)
          majors = {}
          for key, t in parsed:
              major = f'{key[0]}.{key[1]}'
              if major not in majors:
                  majors[major] = t
          mode = os.environ.get('MODE', 'latest')
          if mode == 'all_major':
              out = [{'major': mj, 'tag': t} for mj, t in sorted(majors.items())]
          else:
              newest = parsed[0][1] if parsed else ''
              out = [{'major': '', 'tag': newest}] if newest else []
          print(json.dumps(out))
          EOF
          )
          echo "Mode: $MODE, targets: $TARGETS"
          {
            echo "build_targets=${TARGETS}"
            echo "build_mode=${MODE}"
          } >> "$GITHUB_OUTPUT"
        env:
          MODE: ${{ github.event.client_payload.build_mode || github.event.inputs.build_mode || 'latest' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: ${{ needs.check.outputs.build_targets != '[]' && needs.check.outputs.build_targets != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.check.outputs.build_targets) }}
    name: build-${{ matrix.target.tag }}
    steps:
      ##########################################################
      ###
      ### XXX: Pre-init steps here
      ###
      ##########################################################
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate timestamp
        id: timestamp
        run: |
          TIMESTAMP="$(date +"%Y%m%d")"
          echo "Timestamp: ${TIMESTAMP}"
          echo "value=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      ### XXX: Keep alive cron-type workflows
      - uses: gautamkrishnar/keepalive-workflow@v2

      ##########################################################
      ###
      ### XXX: Env-setup steps here
      ###
      ##########################################################

      - name: Prepare WSL2 Build Environment
        run: |
          # ubuntu-latest ships a modern gcc (13+) which is fine for 6.x kernels
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev \
                                   libdw-dev bc rsync debhelper dpkg-dev

          # BTF (CONFIG_DEBUG_INFO_BTF=y in Microsoft's config) needs pahole;
          # ubuntu-latest's dwarves may lag behind what new kernels need, so
          # build a recent one from source
          sudo apt-get install -y zlib1g-dev libzstd-dev
          git clone -b v1.29 https://github.com/acmel/dwarves
          cd dwarves; mkdir build; cd build
          cmake -D__LIB=lib -DCMAKE_INSTALL_PREFIX=/usr ..
          sudo make install
          cd ../..

          pahole --version

      - name: Download WSL2 Kernel Source
        run: |
          mkdir -p build_workdir; cd build_workdir
          # M$ no longer attaches source tarballs to releases; fetch the
          # codeload tarball for the tag instead
          curl -sL -o kernel.tar.gz \
            "https://github.com/microsoft/WSL2-Linux-Kernel/archive/${{ matrix.target.tag }}.tar.gz"
          tar zxf kernel.tar.gz
          rm kernel.tar.gz
          mv WSL2-Linux-Kernel-${{ matrix.target.tag }} kernelsource

      - name: Detect Kernel Version Traits
        id: traits
        working-directory: build_workdir
        run: |
          cd kernelsource
          VER=$(make kernelversion 2>/dev/null || grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile | \
                awk '{printf "%s.", $3}' | sed 's/\.$//')
          MAJOR=$(echo "$VER" | cut -d. -f1-2)
          echo "Kernel version: $VER (major $MAJOR)"

          # Old kernels (<= 6.1) can fail BTF generation with modern pahole
          # ("FAILED: load BTF from vmlinux: Unknown error -22"): their BTF
          # generation predates what new pahole emits. BTF is not needed for
          # WSL2 (it serves bpftool/co-re), so disable it there.
          # gcc: ubuntu-latest's default gcc (13) builds 5.10 just fine
          # (verified); no downgrade needed.
          case "$MAJOR" in
            5.10|5.15|6.1) NEED_BTF_FIX=yes ;;
            *)             NEED_BTF_FIX=no ;;
          esac

          # mkdebian/builddeb generation: old-style (<= 6.1) vs new-style (>= 6.6)
          case "$MAJOR" in
            5.10|5.15|6.1) PKG_STYLE=old ;;
            *)             PKG_STYLE=new ;;
          esac

          # blacklist file per kernel major; fall back to the generic one
          if [ -f "${{ github.workspace }}/config_filter/blacklist_sections_${MAJOR}" ]; then
            BLACKLIST="config_filter/blacklist_sections_${MAJOR}"
          else
            BLACKLIST="config_filter/blacklist_sections"
          fi

          {
            echo "version=${VER}"
            echo "major=${MAJOR}"
            echo "btffix=${NEED_BTF_FIX}"
            echo "pkgstyle=${PKG_STYLE}"
            echo "blacklist=${BLACKLIST}"
          } >> "$GITHUB_OUTPUT"

      - name: Select Compiler (old kernels)
        if: ${{ false }}  # gcc-13 on ubuntu-latest builds all supported majors (verified locally); kept for reference
        run: |
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          sudo update-alternatives --set gcc /usr/bin/gcc-11
          sudo update-alternatives --set g++ /usr/bin/g++-11
          gcc --version | head -1

      - name: Preprocess Kernel Sources
        working-directory: build_workdir
        run: |
          pushd kernelsource;

            rm -f README-Microsoft.WSL2
            # .scmversion support was removed in ~5.16; LOCALVERSION is pinned
            # by Microsoft/config-wsl (CONFIG_LOCALVERSION="-microsoft-standard-WSL2")
            touch .scmversion
            cp Microsoft/config-wsl .config

            yes "" | (make olddefconfig && make prepare)
            export KREL=$(make kernelrelease)
            export KVER=$(make kernelversion)
            echo "Got Kernel Version Info:"
            echo "    kernelrelease: $KREL"
            echo "    kernelversion: $KVER"
          popd

          sourcedir=$(echo $KREL-$KVER | tr "[:upper:]" "[:lower:]")

          echo "Renaming Kernel Source dir to: $sourcedir"
          mv kernelsource $sourcedir

          echo "KERNEL_DIR=$sourcedir" >> $GITHUB_ENV

      - name: Setup Kernel Config Helpers
        working-directory: build_workdir
        run: |
          cd ${{ env.KERNEL_DIR }}
          # Kconfiglib on PyPI is unmaintained and cannot parse the
          # 'transitional' property added in kernel 6.18; our fork can
          pip3 install git+https://github.com/NyaMisty/Kconfiglib-ng

          # Append the scriptconfig target instead of patching mid-file:
          # survives scripts/kconfig/Makefile changes across kernel versions
          cat >> scripts/kconfig/Makefile <<'EOF'

          # --- appended by wsl2-kernel-ci (kconfiglib scriptconfig support) ---
          PHONY += scriptconfig iscriptconfig
          PYTHONCMD ?= python3
          kpython := PYTHONPATH=$(srctree)/Kconfiglib:$$PYTHONPATH $(PYTHONCMD)
          ifneq ($(filter scriptconfig,$(MAKECMDGOALS)),)
          ifndef SCRIPT
          $(error Use "make scriptconfig SCRIPT=<path> [SCRIPT_ARG=<argument>]")
          endif
          endif
          scriptconfig:
          	$(Q)$(kpython) $(SCRIPT) $(Kconfig) $(if $(SCRIPT_ARG),"$(SCRIPT_ARG)")
          EOF

      - name: Process Kernel Config
        working-directory: build_workdir
        run: |
          cd ${{ env.KERNEL_DIR }}
          cat ${{ github.workspace }}/${{ steps.traits.outputs.blacklist }} | make scriptconfig PYTHONCMD=python3 SCRIPT=${{ github.workspace }}/config_filter/parse_kconfig.py SCRIPT_ARG="get_blacklist_sym" > blacklist_syms
          python3 ${{ github.workspace }}/config_filter/filter_config.py blacklist_syms ${{ github.workspace }}/config_filter/ubuntu_config ubuntu_config_filtered
          python3 ${{ github.workspace }}/config_filter/merge_config.py Microsoft/config-wsl ubuntu_config_filtered .config

      - name: Reconfigure Kernel Config
        working-directory: build_workdir
        run: |
          cd ${{ env.KERNEL_DIR }}
          # Old kernels + modern pahole break BTF generation; disable it there
          # (WSL2 doesn't need BTF)
          if [ "${{ steps.traits.outputs.btffix }}" = "yes" ]; then
            ./scripts/config --disable DEBUG_INFO_BTF --disable DEBUG_INFO_BTF_MODULES || \
              sed -i '/CONFIG_DEBUG_INFO_BTF=y/d;/CONFIG_DEBUG_INFO_BTF_MODULES=y/d' .config
            echo "# CONFIG_DEBUG_INFO_BTF is not set" >> .config
          fi
          yes "" | (make olddefconfig && make prepare)

      ##########################################################
      ###
      ### XXX: Main building steps here
      ###
      ##########################################################

      - name: Compile Kernel Debs (new-style packaging, >= 6.6)
        if: ${{ steps.traits.outputs.pkgstyle == 'new' }}
        working-directory: build_workdir
        run: |
          cd ${{ env.KERNEL_DIR }}

          # WSL2's kernel version contains uppercase '-WSL', which is invalid
          # in Debian package names (dh_listpackages rejects it). Patch
          # scripts/package/mkdebian so the Package: fields use a lowercased
          # version (KDEB_PKGNAMEVER), while file contents inside the
          # packages keep the real mixed-case KERNELRELEASE.
          sed -i 's/^Package: \$packagename-\${KERNELRELEASE}/Package: \$packagename-\${KDEB_PKGNAMEVER}/' scripts/package/mkdebian
          sed -i 's/^Package: linux-image-\${KERNELRELEASE}-dbg/Package: linux-image-\${KDEB_PKGNAMEVER}-dbg/' scripts/package/mkdebian
          sed -i 's/^Package: linux-headers-\${KERNELRELEASE}/Package: linux-headers-\${KDEB_PKGNAMEVER}/' scripts/package/mkdebian

          KREL=$(make kernelrelease)
          KVER=$(make kernelversion)
          echo "Building: KREL=$KREL KVER=$KVER"

          yes "" | make -j$BUILD_THREAD bindeb-pkg \
            KDEB_PKGVERSION=$KVER-1 \
            KDEB_PKGNAMEVER=$(echo $KREL | tr "[:upper:]" "[:lower:]") \
            LOCALVERSION=

      - name: Compile Kernel Debs (old-style packaging, <= 6.1)
        if: ${{ steps.traits.outputs.pkgstyle == 'old' }}
        working-directory: build_workdir
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Old kernels: mkdebian writes 'Package: $packagename-$version' and
          # builddeb (called via intdeb-pkg) hardcodes 'packagename=linux-image-$version'.
          # Lowercase the package names in both places; in-package file paths
          # keep the real mixed-case KERNELRELEASE.
          sed -i 's/-\$version/-\$KDEB_PKGNAMEVER/' scripts/package/mkdebian
          sed -i 's/dpkg-gencontrol -p\$pname /pname=$(echo "\$pname"| tr "[:upper:]" "[:lower:]"); dpkg-gencontrol -p\$pname /' scripts/package/builddeb

          KREL=$(make kernelrelease)
          KVER=$(make kernelversion)
          echo "Building: KREL=$KREL KVER=$KVER"

          yes "" | make -j$BUILD_THREAD bindeb-pkg \
            KDEB_PKGVERSION=$KVER-1 \
            KDEB_PKGNAMEVER=$(echo $KREL | tr "[:upper:]" "[:lower:]") \
            KDEB_SOURCENAME=$(echo $KREL | tr "[:upper:]" "[:lower:]") \
            LOCALVERSION=

      - name: Arrange Artifacts
        working-directory: build_workdir
        run: |
          mv ${{ env.KERNEL_DIR }}/arch/x86/boot/bzImage "bzImage-${{ matrix.target.tag }}"
          rm -rf ${{ env.KERNEL_DIR }}

          mkdir -p /tmp/build_output
          mv *.deb "bzImage-${{ matrix.target.tag }}" /tmp/build_output/ 2>/dev/null || mv ../*.deb /tmp/build_output/ 2>/dev/null || true
          mv /tmp/build_output/../../*.deb /tmp/build_output/ 2>/dev/null || true
          ls -la /tmp/build_output/

      ##########################################################
      ###
      ### XXX: Artifact Upload
      ###
      ##########################################################

      - name: Upload to GitHub Actions artifact
        uses: NyaMisty/upload-artifact-as-is@master
        with:
          path: /tmp/build_output/*
          name: kernel-${{ matrix.target.tag }}

      - name: Create New Release and Upload
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "/tmp/build_output/*"
          name: "${{ format('Nightly Kernel: {0}', matrix.target.tag) }}"
          tag: ${{ matrix.target.tag }}
          commit: ${{ github.sha }}
          #prerelease: true
          allowUpdates: true

          # XXX: edit this to false & true if you want to preserve original artifact
          removeArtifacts: true
          replacesArtifacts: false
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
